name: Deploy Frontend

on:
    push:
        branches: [dev]

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - uses: actions/checkout@v4

            - name: Set lowercase image name
              run: echo "IMAGE_NAME_LOWER=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ env.IMAGE_NAME_LOWER }}:latest
                      ${{ env.IMAGE_NAME_LOWER }}:${{ github.sha }}
                  build-args: |
                      NEXT_PUBLIC_API_URL=http://localhost:3000/api

            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
                        -u ${{ github.actor }} --password-stdin
                      docker pull ${{ env.IMAGE_NAME_LOWER }}:latest
                      docker stop frontend || true
                      docker rm frontend || true
                      docker run -d \
                         --name frontend \
                        --restart unless-stopped \
                        --network host \
                        -e PORT=4200 \
                        --env-file /www/wwwroot/frontend/.env \
                        ${{ env.IMAGE_NAME_LOWER }}:latest

            - name: Notify Telegram success
              if: success()
              run: |
                  curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
                    -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
                    -d text="✅ Frontend deployed successfully!%0ABranch: ${{ github.ref_name }}%0ACommit: ${{ github.sha }}"

            - name: Notify Telegram failure
              if: failure()
              run: |
                  curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
                    -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
                    -d text="❌ Frontend deploy FAILED!%0ABranch: ${{ github.ref_name }}%0ACommit: ${{ github.sha }}"
