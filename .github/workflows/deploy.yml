name: Deploy Frontend

on:
    push:
        branches: [dev]

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - uses: actions/checkout@v4

            - name: Set lowercase image name
              run: echo "IMAGE_NAME_LOWER=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ env.IMAGE_NAME_LOWER }}:latest
                      ${{ env.IMAGE_NAME_LOWER }}:${{ github.sha }}
                  build-args: |
                      NEXT_PUBLIC_API_URL=https://it-blog-server.duckdns.org

            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
                        -u ${{ github.actor }} --password-stdin
                      docker pull ${{ env.IMAGE_NAME_LOWER }}:latest
                      docker stop frontend || true
                      docker rm frontend || true
                      docker run -d \
                        --name frontend \
                        --restart unless-stopped \
                        -p 4200:4200 \
                        -e PORT=4200 \
                        -e NEXT_PUBLIC_API_URL=https://it-blog-server.duckdns.org \
                        ${{ env.IMAGE_NAME_LOWER }}:latest
                      docker image prune -f
